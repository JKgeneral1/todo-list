name: todo-list
services:
  web:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        aliases:
          - todo-list-web
networks:
  proxy:
    external: true
    name: npm_shared
