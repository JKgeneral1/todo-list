# Included by /data/nginx/custom/http.conf in Nginx Proxy Manager.
server {
    listen 80;
    listen [::]:80;
    server_name todo.pervakov.com;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name todo.pervakov.com;
    ssl_certificate /etc/letsencrypt/live/todo-pervakov/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo-pervakov/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    resolver 127.0.0.11 valid=30s;
    set $todo_backend todo-list-web:8080;
    location / {
        proxy_pass http://$todo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
